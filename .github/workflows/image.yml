name: Container image

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  image:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate release version
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ || ${#GITHUB_REF_NAME} -gt 128 ]]; then
            echo "::error::Release tag must use vMAJOR.MINOR.PATCH and fit in a Docker tag"
            exit 1
          fi

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Build image
        run: |
          docker build --pull --tag rclone-watch:ci \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.version=$GITHUB_REF_NAME" .

      - name: Test file watching and upload
        run: |
          watch_dir=$(mktemp -d)
          mkdir "$watch_dir/nested"
          trap 'docker logs rclone-watch-ci; docker rm -f rclone-watch-ci; rm -rf "$watch_dir"' EXIT
          docker run --detach --init --name rclone-watch-ci \
            --mount "type=bind,src=$watch_dir,dst=/watch,readonly" \
            -e RCLONE_REMOTE=:local:/out -e S3_PREFIX=backup -e UPLOAD_DELAY=0 -e MAX_PARALLEL=1 \
            -e WATCH_INCLUDE=$'*.txt\n*.csv' -e WATCH_EXCLUDE='*.tmp.txt' \
            rclone-watch:ci

          timeout 20 bash -c '
            until docker logs rclone-watch-ci 2>&1 | grep -q "Watches established"; do
              sleep 0.5
            done
          '
          test "$(docker exec rclone-watch-ci cat /etc/alpine-release)" = 3.23.8
          touch "$watch_dir/nested/excluded.tmp.txt" "$watch_dir/nested/unmatched.log"
          printf '%s\n' 'test payload' > "$watch_dir/nested/file name.csv"
          timeout 30 bash -c '
            until docker exec rclone-watch-ci cmp -s \
              "/watch/nested/file name.csv" "/out/backup/nested/file name.csv"; do
              sleep 0.5
            done
          '
          docker exec rclone-watch-ci test ! -e /out/backup/nested/excluded.tmp.txt
          docker exec rclone-watch-ci test ! -e /out/backup/nested/unmatched.log

      - name: Publish to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker tag rclone-watch:ci "$image:$GITHUB_REF_NAME"
          docker push "$image:$GITHUB_REF_NAME"
          docker tag rclone-watch:ci "$image:latest"
          docker push "$image:latest"
