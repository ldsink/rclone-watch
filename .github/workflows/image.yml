name: Container image

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  image:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate release version
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ || ${#GITHUB_REF_NAME} -gt 128 ]]; then
            echo "::error::Release tag must use vMAJOR.MINOR.PATCH and fit in a Docker tag"
            exit 1
          fi

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Build image
        run: |
          docker build --pull --tag rclone-watch:ci \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.version=$GITHUB_REF_NAME" .

      - name: Test file watching and upload
        run: bash tests/watch-and-upload.sh

      - name: Test deletion after upload
        run: bash tests/delete-after-upload.sh

      - name: Publish to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker tag rclone-watch:ci "$image:$GITHUB_REF_NAME"
          docker push "$image:$GITHUB_REF_NAME"
          docker tag rclone-watch:ci "$image:latest"
          docker push "$image:latest"
