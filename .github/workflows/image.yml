name: Container image

on:
  pull_request:
  push:
    tags:
      - "v*"
    branches:
      - "**"

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Build image
        run: |
          docker build --pull --tag rclone-watch:ci \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" .

      - name: Test file watching and upload
        run: |
          watch_dir=$(mktemp -d)
          mkdir "$watch_dir/nested"
          trap 'docker logs rclone-watch-ci; docker rm -f rclone-watch-ci; rm -rf "$watch_dir"' EXIT
          docker run --detach --init --name rclone-watch-ci \
            --mount "type=bind,src=$watch_dir,dst=/watch,readonly" \
            -e RCLONE_REMOTE=:local:/out -e S3_PREFIX=backup -e UPLOAD_DELAY=0 \
            rclone-watch:ci

          timeout 20 bash -c '
            until docker logs rclone-watch-ci 2>&1 | grep -q "Watches established"; do
              sleep 0.5
            done
          '
          test "$(docker exec rclone-watch-ci cat /etc/alpine-release)" = 3.23.8
          printf '%s\n' 'test payload' > "$watch_dir/nested/file name.txt"
          timeout 30 bash -c '
            until docker exec rclone-watch-ci cmp -s \
              "/watch/nested/file name.txt" "/out/backup/nested/file name.txt"; do
              sleep 0.5
            done
          '

      - name: Publish to GHCR
        if: github.event_name == 'push' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v'))
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tag=latest
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
          fi
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker tag rclone-watch:ci "$image:$tag"
          docker push "$image:$tag"
